name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer (fail only on errors)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path ./pfsense_report.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) { $results | Format-Table -AutoSize | Out-String | Write-Host }
          $errors = @($results | Where-Object { $_.Severity -in @('Error','ParseError') })
          if ($errors.Count -gt 0) {
            Write-Error ("PSScriptAnalyzer reported {0} error(s)." -f $errors.Count)
            exit 1
          }
          Write-Host "No analyzer errors."

      - name: Tests on PowerShell 7
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1

      - name: Tests on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Invoke-Tests.ps1
